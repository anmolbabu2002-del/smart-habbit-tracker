# The website is the new app (app/), built with Vite. The AI chat, book proxy and voices are
# Netlify Functions, also used by the Android app.
[build]
  base = "app"
  command = "npm ci && npm run build"
  publish = "dist"
  functions = "../netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # camera=(self): photo proof uses the app's own camera
    Permissions-Policy = "camera=(self), geolocation=(), payment=()"

# Built files have unique names: cache them for a year
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Always revalidate the service worker and app shell so updates reach people fast
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
