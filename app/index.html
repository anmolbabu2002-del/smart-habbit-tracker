<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FF8C42" />
    <meta name="description" content="Habits, tasks and deep focus, with an evolving streak and app locking." />
    <link rel="icon" type="image/png" href="icon-192-v3.png" />
    <link rel="apple-touch-icon" href="icon-512-v3.png" />
    <link rel="manifest" href="manifest.json" />
    <title>Ultradian</title>
    <!-- the right background from the very first frame (before the CSS loads), light or dark -->
    <script>try { if (JSON.parse(localStorage.getItem('ultradian.v2') || '{}').theme === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}</script>
    <style>html, body { background: #f7f9fc; } html[data-theme='dark'], html[data-theme='dark'] body { background: #131820; }</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
