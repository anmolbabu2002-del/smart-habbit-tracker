# Builds the Ultradian Android app (Capacitor) on GitHub's servers — no laptop needed.
# Every push to main makes a new signed APK and puts it on the Releases page:
#   https://github.com/anmolbabu2002-del/smart-habbit-tracker/releases/latest/download/Ultradian.apk
#
# Signing: every build is signed with the same key (.github/android/ultradian.jks, or the
# ANDROID_KEYSTORE_BASE64 secret if you add one), so new versions install over the old
# one and your data is kept. Never lose or change that key.
#
# The Capacitor project (app-android/) is created fresh on each run; nothing extra
# needs to live in the repo. Big .mp3/.mp4 files are left out of the APK and stream
# from ultradiann.netlify.app instead (see the top of storage.js).

name: Build Android app

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'netlify/**'
      - 'netlify.toml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Unlocks the signing key; the key file itself is what matters.
      KEYSTORE_PASSWORD: ultradian-sideload
      KEY_ALIAS: ultradian
    defaults:
      run:
        working-directory: app-android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up the Capacitor project
        working-directory: .
        run: |
          mkdir -p app-android
          cat > app-android/package.json <<'JSON'
          {
            "name": "ultradian-android",
            "private": true,
            "dependencies": {
              "@capacitor-community/text-to-speech": "^6.1.0",
              "@capacitor/android": "^7.0.0",
              "@capacitor/app": "^7.0.0",
              "@capacitor/core": "^7.0.0",
              "@capacitor/filesystem": "^7.0.0",
              "@capacitor/haptics": "^7.0.0",
              "@capacitor/local-notifications": "^7.0.0",
              "@capacitor/share": "^7.0.0"
            },
            "devDependencies": {
              "@capacitor/assets": "^3.0.5",
              "@capacitor/cli": "^7.0.0"
            }
          }
          JSON
          cat > app-android/capacitor.config.json <<'JSON'
          {
            "appId": "com.anmoljha.ultradian",
            "appName": "Ultradian",
            "webDir": "www",
            "server": { "androidScheme": "https" },
            "android": { "backgroundColor": "#F0F4FA" }
          }
          JSON
          node - <<'JS'
          const fs = require('fs');
          const skip = new Set(['.git', '.github', '.gitignore', '.netlify', '.vscode', '_archive',
            'app-android', 'netlify', 'netlify.toml', 'node_modules']);
          fs.mkdirSync('app-android/www', { recursive: true });
          for (const name of fs.readdirSync('.')) {
            if (skip.has(name) || /\.(md|mp3|mp4)$/i.test(name)) continue;
            fs.cpSync(name, 'app-android/www/' + name, { recursive: true });
          }
          JS
          ls app-android/www
          du -sh app-android/www

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Create the Android project
        run: npx cap add android

      - name: Add native code (edge-to-edge system bars)
        run: |
          dest=android/app/src/main/java/com/anmoljha/ultradian
          cp ../.github/android/MainActivity.java ../.github/android/SystemBarsPlugin.java "$dest/"
          ls "$dest"

      - name: App icon
        continue-on-error: true
        run: |
          mkdir -p assets
          cp ../icon-512-v2.png assets/icon-only.png
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#121212' --iconBackgroundColorDark '#121212' \
            --splashBackgroundColor '#121212' --splashBackgroundColorDark '#121212'

      - name: Habit reminder icons, exact alarms and camera
        run: |
          # Notification icons drawn in notify-icons/svg, rendered to PNG in notify-icons/android
          cp -r ../notify-icons/android/. android/app/src/main/res/
          ls android/app/src/main/res/drawable-nodpi
          # Reminders every 2 minutes need exact alarms, or Android spaces them out while the
          # phone sleeps. Granted automatically at install (no pop-up); the only thing the
          # user is asked is "Allow notifications".
          manifest=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32" />\n</manifest>#' "$manifest"
          grep -n "EXACT_ALARM" "$manifest"
          # Photo proof for habits uses the app's own camera (Android asks the first time)
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' "$manifest"
          grep -n "CAMERA\|hardware.camera" "$manifest"

      - name: Sync web files and plugins
        run: npx cap sync android

      - name: Set version number
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -nE "versionCode|versionName" android/app/build.gradle

      - name: Build signed APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/ultradian.jks"
          else
            cp "$GITHUB_WORKSPACE/.github/android/ultradian.jks" "$RUNNER_TEMP/ultradian.jks"
          fi
          cd android
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/ultradian.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD" 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            # Surface compile errors as annotations (readable without opening the log)
            grep -E "error:|e: |What went wrong|FAILURE" -A2 "$RUNNER_TEMP/gradle.log" | head -n 30 | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::${line}"
            done
            rm -f "$RUNNER_TEMP/ultradian.jks"
            exit "$status"
          fi
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Ultradian.apk"
          rm -f "$RUNNER_TEMP/ultradian.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: Ultradian-apk
          path: Ultradian.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-app
          name: Ultradian Android app
          make_latest: true
          files: Ultradian.apk
          body: |
            Latest build: version 1.0.${{ github.run_number }} (commit ${{ github.sha }}).
            On your phone, download **Ultradian.apk** below and open it to install or update.
            Updates install over the old version and keep your data.
